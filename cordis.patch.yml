# dsh-claude-tasklist bundle layer.
- insert:
    - id: dsh-claude-tasklist
      name: dsh-claude-tasklist
      config:
        # Hide dsh's own todo_write from the model so it keeps one list, not two.
        hideBuiltinTodo: true
        # Steps and the next-step box are written in this language ("auto" follows the user).
        language: zh-CN

# Stepping through a plan calls `update_plan {"advance": true}` several times in a
# row by design; keep the repeat-call reminder from flagging it. A patch replaces
# the whole row config, so the shipped values are restated here.
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500
    exclude: [update_plan]
