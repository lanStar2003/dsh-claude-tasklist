name: Release

# Pushing a version tag (v0.2.0) tests and packs the plugin and publishes a GitHub release with
# dsh-claude-tasklist-<version>.tgz attached; dsh installs the plugin straight from that asset's URL.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm test

      # dsh's `plugin add` never builds, so lib/client.js stays committed; fail if it is stale.
      - name: Build
        run: |
          npm run build
          if ! git diff --exit-code -- lib/client.js; then
            echo "::error::lib/client.js is out of date: run npm run build and commit it"
            exit 1
          fi

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/dsh-claude-tasklist-${VERSION}.tgz" \
            --title "dsh-claude-tasklist ${VERSION}" \
            --verify-tag \
            --generate-notes \
            $PRE
